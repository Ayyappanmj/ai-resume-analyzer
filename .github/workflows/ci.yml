name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app --line-length 120 || true

      - name: Run tests
        run: pytest -v
        env:
          DATABASE_URL: ""
          OLLAMA_HOST: "http://localhost:11434"

  docker-build:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t resume-analyzer-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t resume-analyzer-frontend:ci ./frontend
