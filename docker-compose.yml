services:
  db:
    image: postgres:16-alpine
    container_name: resume-db
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume
      POSTGRES_DB: resume
    volumes: ["pg_data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: resume-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://resume:resume@db:5432/resume
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: resume-frontend
    environment:
      API_URL: http://backend:8000
    ports: ["8501:8501"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  pg_data:
